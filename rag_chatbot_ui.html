<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RAG Chatbot</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0f12; --surface: #161a20; --surface2: #1e242d;
    --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.13);
    --text: #e8eaf0; --muted: #7a8499; --accent: #5be3c1; --accent2: #f5a623;
    --user-bg: #1a2f28; --user-border: rgba(91,227,193,0.2);
    --bot-bg: #161a20; --bot-border: rgba(255,255,255,0.07);
    --input-bg: #1e242d;
    --font-main: 'Sora', sans-serif; --font-mono: 'IBM Plex Mono', monospace;
  }
  body { font-family: var(--font-main); background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .header { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; border-bottom: 0.5px solid var(--border2); background: var(--surface); flex-shrink: 0; }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .logo-icon { width: 32px; height: 32px; background: linear-gradient(135deg, #5be3c1, #1a9e80); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .logo-text { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
  .logo-sub { font-size: 11px; font-family: var(--font-mono); color: var(--muted); margin-top: 1px; }
  .status-pill { display: flex; align-items: center; gap: 6px; font-size: 12px; font-family: var(--font-mono); color: var(--muted); background: var(--surface2); border: 0.5px solid var(--border); border-radius: 100px; padding: 4px 12px; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #666; transition: background 0.3s; }
  .status-dot.ok { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .status-dot.err { background: #e24b4a; }
  .upload-bar { display: flex; align-items: center; gap: 10px; padding: 10px 24px; background: var(--surface); border-bottom: 0.5px solid var(--border); flex-shrink: 0; }
  .upload-bar label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; font-family: var(--font-mono); color: var(--muted); background: var(--surface2); border: 0.5px solid var(--border2); border-radius: 6px; padding: 6px 12px; transition: color 0.2s, border-color 0.2s; }
  .upload-bar label:hover { color: var(--accent); border-color: var(--accent); }
  .upload-bar input[type=file] { display: none; }
  .upload-info { font-size: 12px; font-family: var(--font-mono); color: var(--muted); }
  .upload-info span { color: var(--accent); }
  .reset-btn { margin-left: auto; font-size: 11px; font-family: var(--font-mono); color: #e24b4a; background: rgba(226,75,74,0.08); border: 0.5px solid rgba(226,75,74,0.25); border-radius: 6px; padding: 5px 10px; cursor: pointer; transition: background 0.2s; }
  .reset-btn:hover { background: rgba(226,75,74,0.16); }
  .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 4px; }
  .welcome { text-align: center; padding: 60px 20px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .welcome-icon { width: 56px; height: 56px; background: rgba(91,227,193,0.1); border: 0.5px solid rgba(91,227,193,0.3); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
  .welcome h2 { font-size: 18px; font-weight: 500; }
  .welcome p { font-size: 13px; color: var(--muted); max-width: 340px; line-height: 1.7; }
  .suggestion-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 8px; }
  .chip { font-size: 12px; font-family: var(--font-mono); color: var(--muted); background: var(--surface2); border: 0.5px solid var(--border2); border-radius: 100px; padding: 6px 14px; cursor: pointer; transition: all 0.2s; }
  .chip:hover { color: var(--accent); border-color: var(--accent); background: rgba(91,227,193,0.05); }
  .msg-row { display: flex; gap: 12px; max-width: 820px; width: 100%; margin: 0 auto; animation: fadeSlide 0.25s ease; }
  @keyframes fadeSlide { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg-row.user { flex-direction: row-reverse; }
  .avatar { width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; }
  .avatar.user { background: rgba(91,227,193,0.15); color: var(--accent); border: 0.5px solid var(--user-border); }
  .avatar.bot { background: var(--surface2); color: var(--muted); border: 0.5px solid var(--border2); font-size: 15px; }
  .bubble { border-radius: 12px; padding: 14px 16px; font-size: 14px; line-height: 1.7; max-width: calc(100% - 44px); border: 0.5px solid; }
  .bubble.user { background: var(--user-bg); border-color: var(--user-border); color: var(--text); border-radius: 12px 4px 12px 12px; }
  .bubble.bot { background: var(--bot-bg); border-color: var(--bot-border); color: var(--text); border-radius: 4px 12px 12px 12px; }
  .sources-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; padding-top: 10px; border-top: 0.5px solid var(--border); }
  .sources-label { width: 100%; font-size: 10px; font-family: var(--font-mono); color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 2px; }
  .source-chip { font-size: 10px; font-family: var(--font-mono); background: rgba(245,166,35,0.08); color: var(--accent2); border: 0.5px solid rgba(245,166,35,0.25); border-radius: 4px; padding: 3px 8px; }
  .typing-indicator { display: flex; gap: 5px; align-items: center; padding: 14px 16px; height: 46px; }
  .typing-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); animation: bounce 1.2s infinite ease-in-out; }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: 0.4; } 40% { transform: translateY(-6px); opacity: 1; } }
  .input-area { padding: 16px 24px 20px; background: var(--surface); border-top: 0.5px solid var(--border2); flex-shrink: 0; }
  .input-wrap { display: flex; align-items: flex-end; gap: 10px; background: var(--input-bg); border: 0.5px solid var(--border2); border-radius: 14px; padding: 10px 14px; transition: border-color 0.2s; max-width: 820px; margin: 0 auto; }
  .input-wrap:focus-within { border-color: rgba(91,227,193,0.4); }
  .input-wrap textarea { flex: 1; background: transparent; border: none; outline: none; resize: none; font-family: var(--font-main); font-size: 14px; color: var(--text); line-height: 1.6; max-height: 140px; min-height: 24px; }
  .input-wrap textarea::placeholder { color: var(--muted); }
  .send-btn { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: opacity 0.2s, transform 0.15s; }
  .send-btn:hover { opacity: 0.85; }
  .send-btn:active { transform: scale(0.93); }
  .send-btn:disabled { opacity: 0.3; cursor: default; }
  .input-hint { text-align: center; font-size: 11px; font-family: var(--font-mono); color: var(--muted); margin-top: 10px; max-width: 820px; margin-left: auto; margin-right: auto; }
  .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(10px); background: var(--surface2); border: 0.5px solid var(--border2); border-radius: 8px; padding: 10px 18px; font-size: 13px; font-family: var(--font-mono); color: var(--text); opacity: 0; pointer-events: none; transition: all 0.25s; z-index: 100; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { border-color: rgba(226,75,74,0.4); color: #f09595; }
  .toast.ok { border-color: rgba(91,227,193,0.3); color: var(--accent); }
</style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <div class="logo-icon">⬡</div>
    <div>
      <div class="logo-text">RAG Chatbot</div>
      <div class="logo-sub">Groq · Jina · ChromaDB</div>
    </div>
  </div>
  <div class="status-pill">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">checking...</span>
  </div>
</div>
<div class="upload-bar">
  <label for="pdf-input">⬆ Upload PDF</label>
  <input type="file" id="pdf-input" accept=".pdf" onchange="uploadPDF(this)" />
  <span class="upload-info" id="doc-count">— docs indexed</span>
  <!-- <button class="reset-btn" onclick="resetDB()">✕ Reset DB</button> -->
</div>
<div class="messages" id="messages">
  <div class="welcome" id="welcome">
    <div class="welcome-icon">⬡</div>
    <h2>Ask your documents</h2>
    <p>Upload PDFs to the <code style="font-family:var(--font-mono);font-size:12px;color:var(--accent)">data/</code> folder and index them, then ask anything about the content.</p>
    <!-- 
    <div class="suggestion-chips">
      <div class="chip" onclick="useChip(this)">Summarize the key topics</div>
      <div class="chip" onclick="useChip(this)">What are the main findings?</div>
      <div class="chip" onclick="useChip(this)">List the key definitions</div>
      <div class="chip" onclick="useChip(this)">What methodology is used?</div>
    </div>
    -->
  </div>
</div>
<div class="input-area">
  <div class="input-wrap">
    <textarea id="query-input" rows="1" placeholder="Ask anything about your documents..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" id="send-btn" onclick="sendMessage()" disabled>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M8 13V3M8 3L3 8M8 3L13 8" stroke="#0d0f12" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
  <div class="input-hint">Enter to send · Shift+Enter for new line · API at localhost:8000</div>
</div>
<div class="toast" id="toast"></div>
<script>
const API = 'http://localhost:8000';
let isLoading = false;
const $ = id => document.getElementById(id);
const messagesEl = $('messages');
const inputEl = $('query-input');
const sendBtn = $('send-btn');
async function checkStatus() {
  try {
    const r = await fetch(`${API}/status`);
    const d = await r.json();
    $('status-dot').className = 'status-dot ok';
    $('status-text').textContent = 'connected';
    $('doc-count').innerHTML = `<span>${d.document_count}</span> chunks indexed`;
  } catch {
    $('status-dot').className = 'status-dot err';
    $('status-text').textContent = 'disconnected';
    $('doc-count').textContent = 'API offline';
  }
}
checkStatus();
setInterval(checkStatus, 10000);
inputEl.addEventListener('input', () => { sendBtn.disabled = !inputEl.value.trim() || isLoading; });
function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!sendBtn.disabled) sendMessage(); } }
function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 140) + 'px'; }
function useChip(el) { inputEl.value = el.textContent; autoResize(inputEl); sendBtn.disabled = false; inputEl.focus(); }
function removeWelcome() { const w = $('welcome'); if (w) w.remove(); }
function addMessage(role, text, sources = []) {
  removeWelcome();
  const row = document.createElement('div');
  row.className = `msg-row ${role}`;
  let sourcesHTML = '';
  if (sources.length > 0) {
    sourcesHTML = `<div class="sources-row"><div class="sources-label">sources</div>${sources.map(s => `<div class="source-chip">${escapeHtml(s)}</div>`).join('')}</div>`;
  }
  row.innerHTML = `<div class="avatar ${role === 'user' ? 'user' : 'bot'}">${role === 'user' ? 'U' : '⬡'}</div><div class="bubble ${role}">${escapeHtml(text).replace(/\n/g, '<br/>')}${sourcesHTML}</div>`;
  messagesEl.appendChild(row);
  row.scrollIntoView({ behavior: 'smooth', block: 'end' });
}
function addTyping() {
  removeWelcome();
  const row = document.createElement('div');
  row.className = 'msg-row bot'; row.id = 'typing-row';
  row.innerHTML = `<div class="avatar bot">⬡</div><div class="bubble bot typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
  messagesEl.appendChild(row);
  row.scrollIntoView({ behavior: 'smooth', block: 'end' });
}
function removeTyping() { const t = $('typing-row'); if (t) t.remove(); }
async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || isLoading) return;
  isLoading = true; sendBtn.disabled = true; inputEl.value = ''; inputEl.style.height = 'auto';
  addMessage('user', text); addTyping();
  try {
    const r = await fetch(`${API}/query`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query: text }) });
    const d = await r.json();
    removeTyping();
    if (!r.ok) { addMessage('bot', `Error: ${d.detail || 'Something went wrong.'}`); }
    else { addMessage('bot', d.answer, d.sources || []); }
  } catch { removeTyping(); addMessage('bot', 'Could not reach the API. Make sure the server is running at localhost:8000.'); }
  isLoading = false; sendBtn.disabled = !inputEl.value.trim();
}
async function uploadPDF(input) {
  const file = input.files[0]; if (!file) return;
  showToast(`Uploading ${file.name}…`);
  const form = new FormData(); form.append('file', file);
  try {
    const r = await fetch(`${API}/upload`, { method: 'POST', body: form });
    const d = await r.json();
    if (r.ok) { showToast(d.message, 'ok'); checkStatus(); }
    else { showToast(`Upload failed: ${d.detail}`, 'err'); }
  } catch { showToast('Upload failed — is the API running?', 'err'); }
  input.value = '';
}
async function resetDB() {
  if (!confirm('Clear all indexed documents?')) return;
  try {
    const r = await fetch(`${API}/reset`, { method: 'DELETE' });
    const d = await r.json();
    showToast(d.message, 'ok'); checkStatus();
  } catch { showToast('Reset failed — is the API running?', 'err'); }
}
function showToast(msg, type = '') {
  const t = $('toast'); t.textContent = msg; t.className = `toast show ${type}`;
  clearTimeout(t._timer); t._timer = setTimeout(() => { t.className = 'toast'; }, 3200);
}
function escapeHtml(str) { return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
</body>
</html>
